[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
rents_ticketing = "E92DmfyvMfLBWs9TqzFzN11khwxopKEvCKPoD3jY9zhw"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "if [ ! -f .metaplex/mpl-token-metadata.so ]; then mkdir -p .metaplex && solana program dump -u d metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s .metaplex/mpl-token-metadata.so; fi && npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000

# Load the Metaplex Token Metadata program from a local .so binary at validator startup.
# Using --bpf-program (via test.genesis) is more reliable than cloning from devnet,
# as it does not depend on network access during tests.
# The .so was obtained via: solana program dump -u d metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s .metaplex/mpl-token-metadata.so
[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
program = ".metaplex/mpl-token-metadata.so"

[hooks]
